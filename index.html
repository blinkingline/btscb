<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>But Then She Came Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="screen-title" class="screen">
  <div class="title-card">
    <h1>But Then She Came Back</h1>
    <p class="tagline">She was gone. Now she isn't. Something in the house still hungers.</p>
    <p class="credit">A solo game by Amabel Holland &mdash; web adaptation</p>
    <button id="btn-start" class="btn btn-primary">Begin</button>
  </div>
</section>

<section id="screen-game" class="screen" hidden>
  <header class="hud">
    <div class="hud-top">
      <div class="resources">
        <span class="resource resource-blood"><span class="res-icon">&#129656;</span><span id="res-blood">0</span></span>
        <span class="resource resource-knife"><span class="res-icon">&#128298;</span><span id="res-knife">0</span></span>
        <span class="resource resource-lock"><span class="res-icon">&#128274;</span><span id="res-lock">0</span></span>
      </div>
      <div class="phase-indicator" id="phase-indicator">Morning</div>
    </div>
    <div id="forecast" class="forecast"></div>
  </header>

  <section class="board-row heart-row">
    <h2 class="row-label">Her</h2>
    <div id="heart-line" class="card-line"></div>
  </section>

  <section class="board-row track-row">
    <h2 class="row-label">Action Track</h2>
    <div id="action-track" class="track"></div>
    <div id="piece-tray" class="piece-tray"></div>
  </section>

  <section class="board-row friend-row">
    <h2 class="row-label">Friends</h2>
    <div id="friend-line" class="card-line"></div>
  </section>

  <section class="controls">
    <button id="btn-end-morning" class="btn btn-secondary" hidden>End Morning</button>
  </section>

  <section id="recap-panel" class="recap-panel" hidden>
    <p id="recap-text"></p>
    <button id="btn-continue" class="btn btn-primary">Continue</button>
  </section>

  <section id="log-panel" class="log-panel">
    <h2 class="row-label">Log</h2>
    <ul id="log-list"></ul>
  </section>
</section>

<section id="screen-ending" class="screen" hidden>
  <div class="title-card">
    <h1 id="ending-title">The End</h1>
    <p id="ending-text" class="tagline"></p>
    <button id="btn-restart" class="btn btn-primary">Play Again</button>
  </div>
</section>

<div id="choice-modal" class="modal" hidden>
  <div class="modal-box">
    <p id="choice-prompt"></p>
    <div id="choice-options" class="modal-options"></div>
  </div>
</div>

<script src="cards.js"></script>
<script src="game.js"></script>
</body>
</html>
